name: Publicar el sitio

# Publica src/ en GitHub Pages cada vez que se toca la web en main.
# Los tests corren primero: si fallan, no se publica nada.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que termine la última y se cancele la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true hace que la action prenda Pages sola la primera vez.
      # Sin esto falla con "Get Pages site failed" hasta que alguien va a
      # Settings y lo activa a mano.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
